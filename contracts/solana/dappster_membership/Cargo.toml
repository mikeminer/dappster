[package]
name = "dappster-membership"
version = "0.1.0"
description = "Dappster USDC membership and soulbound credits"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dappster_membership"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
solana-program = "1.18.26"
